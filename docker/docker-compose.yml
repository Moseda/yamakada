version: "3"

services:
  backend:
    build: ../backend
    ports:
      - "3002:3002"

    env_file:
      - ../backend/.env
    environment:
      - DB_HOST=database
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      - database

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  database:
    image: mariadb:latest
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=DB_PASSWORD
      - MYSQL_DATABASE=DB_NAME
      - MYSQL_USER=DB_USER
      - MYSQL_PASSWORD=DB_PASSWORD
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
